server:
  port: 8080
  servlet:
    context-path: /

spring:
  profiles:
    active: dev
  jackson:
    # 日期格式化
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    # 序列化配置
    default-property-inclusion: non_null

# MyBatis-Plus配置
mybatis-plus:
  # Mapper XML文件路径
  mapper-locations: classpath:mapper/**/*.xml
  # 实体类包路径
  type-aliases-package: com.icesphere.camera.entity
  configuration:
    # 开启驼峰命名转换
    map-underscore-to-camel-case: true
    # 日志输出
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      # 主键自增策略
      id-type: auto
      # 逻辑删除配置
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Sa-Token配置
sa-token:
  # Token名称
  token-name: Authorization
  # Token有效期（秒），默认30天，-1代表永不过期
  timeout: 2592000
  # Token临时有效期（指定时间内无操作则过期），-1代表不限制
  activity-timeout: -1
  # 是否允许同一账号并发登录
  is-concurrent: true
  # 在多人登录同一账号时，是否共用一个Token
  is-share: false
  # Token风格
  token-style: uuid
  # 是否输出操作日志
  is-log: false

# OSS存储类型：local（本地存储）或 aliyun（阿里云OSS）
oss:
  storage-type: local

spring:
  # MySQL数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ice_sphere_camera?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root

  # Redis配置
  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 5000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: 3000ms

# 本地文件存储配置
oss:
  storage-type: local
  local:
    path: uploads
    url-prefix: /uploads/

# 阿里云OSS配置（开发环境暂不使用）
# oss:
#   storage-type: aliyun
# aliyun:
#   oss:
#     endpoint: oss-cn-hangzhou.aliyuncs.com
#     accessKeyId: your-access-key-id
#     accessKeySecret: your-access-key-secret
#     bucketName: your-bucket-name

# 日志级别
logging:
  level:
    com.icesphere.camera: debug
    com.baomidou.mybatisplus: debug

name: Flutter Build

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - '.github/workflows/flutter-build.yml'

defaults:
  run:
    working-directory: app

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Verify APK exists
        run: ls -la build/app/outputs/flutter-apk/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  release:
    needs: build-android
    runs-on: ubuntu-latest
    if: ${{ needs.build-android.result == 'success' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: ./release-assets/

      - name: Get version info
        id: version
        run: |
          VERSION="v1.0.0-$(date +'%Y%m%d')-$(echo ${{ github.sha }} | cut -c1-7)"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "球形全景拍摄 ${{ steps.version.outputs.version }}"
          body: |
            ## 球形全景拍摄 ${{ steps.version.outputs.version }}

            ### 更新内容
            - 3D球形引导拍摄
            - 全景浏览（手势滑动/缩放）
            - 房源管理
            - FTP上传 / 分享导出到PC
            - 云端全景拼接

            ### 安装说明
            1. 下载 `app-release.apk`
            2. 在Android手机上开启"允许安装未知来源应用"
            3. 安装APK即可使用

            > 要求：Android 9.0+ (minSdk 24)
          files: |
            release-assets/app-release.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ios:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Install CocoaPods
        run: |
          cd ios
          pod install || true

      - name: Build iOS (no code signing)
        run: flutter build ios --no-codesign
